[package]
name = "barbican"
version = "0.2.1"
edition = "2021"

[dependencies]
regex = "1"
slint = { version = "1.8", features = ["raw-window-handle-06", "renderer-skia", "unstable-winit-030"] }
wry = ">=0.45"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
sha2 = "0.10"
crc32fast = "1"
getrandom = "0.2"
# the TOTP code of the account security page (src/security.rs); already in the tree through other crates
sha1 = "0.10"
libloading = "0.9"
png = "0.17"
notify-rust = "4"
iana-time-zone = "0.1"
# signed update manifests (src/updater.rs)
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# app, tray and badge icons drawn from ui/barbican.svg (already in the tree through Slint)
resvg = { version = "0.48", default-features = false }
parley = "=0.11.1"
idna = "1.1"
# the BIMI verified badge (src/bimi.rs): the mark certificate chain, against pinned roots; the
# same versions reqwest's rustls already builds
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

blitz-html = "=0.3.0-beta.4"
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"

# Platform layer (src/platform): Windows uses WebView2, Credential Manager, the registry
# theme, ISpellChecker and WinRT toasts; Linux uses WebKitGTK (wry), Secret Service,
# the XDG portal colour scheme, hunspell and freedesktop notifications.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_NetworkManagement_Dns", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }
keyring = { version = "3", features = ["windows-native"] }
# the same crate and features the keyring crate already builds: secrets.rs writes its own
# credentials with CRED_PERSIST_LOCAL_MACHINE (keyring can only write ENTERPRISE)
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# StatusNotifierItem over D-Bus (no libappindicator needed)
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# wry's WebKitGTK view lives in GTK: initialised once and pumped from the Slint loop
gtk = "0.18"

[build-dependencies]
slint-build = "1.8"

[features]
# the automation channel's writing test commands (rx-import / rx-find / rx-destroy); test builds only
automation-writes = []

# .deb (cargo deb, .github/workflows/release.yml). The install-kind marker tells the updater
# that apt owns these files, so it only says a new version exists.
[package.metadata.deb]
name = "barbican"
maintainer = "Barbican"
copyright = "Barbican contributors"
extended-description = "Native mail, calendar and contacts client for Stalwart (JMAP)."
section = "mail"
priority = "optional"
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0"
recommends = "hunspell"
assets = [
    ["target/release/barbican", "usr/lib/barbican/barbican", "755"],
    ["packaging/linux/install-kind", "usr/lib/barbican/install-kind", "644"],
    ["packaging/linux/barbican.desktop", "usr/share/applications/barbican.desktop", "644"],
    ["packaging/icons/barbican-256.png", "usr/share/icons/hicolor/256x256/apps/barbican.png", "644"],
    ["packaging/icons/barbican-128.png", "usr/share/icons/hicolor/128x128/apps/barbican.png", "644"],
    ["packaging/icons/barbican-64.png", "usr/share/icons/hicolor/64x64/apps/barbican.png", "644"],
    ["packaging/icons/barbican-48.png", "usr/share/icons/hicolor/48x48/apps/barbican.png", "644"],
    ["packaging/icons/barbican-32.png", "usr/share/icons/hicolor/32x32/apps/barbican.png", "644"],
    ["packaging/icons/barbican.svg", "usr/share/icons/hicolor/scalable/apps/barbican.svg", "644"],
]
maintainer-scripts = "packaging/linux/debian"

[package.metadata.wix]
# per-user MSI from wix/main.wxs
eula = false
