[package]
name = "barbican"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.8", features = ["raw-window-handle-06", "renderer-skia"] }
wry = ">=0.45"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
libloading = "0.8"
png = "0.17"
notify-rust = "4"
iana-time-zone = "0.1"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
keyring = { version = "3", features = ["windows-native"] }

blitz-html = "=0.3.0-beta.4"
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"

[build-dependencies]
slint-build = "1.8"
