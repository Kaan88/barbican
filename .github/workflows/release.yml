# Release: push a tag v1.2.3 (stable) or v1.2.3-beta.1 (beta).
#
# Builds and tests on Windows x64 and Ubuntu, packages
#   Windows: per-user Inno Setup installer (packaging/inno/barbican.iss) + portable zip
#            (the MSI, cargo-wix + wix/main.wxs, is on hold: built only when vars.BUILD_MSI is "true")
#   Linux:   AppImage (linuxdeploy) + .deb (cargo-deb)
# then writes SHA256SUMS, the signed update manifest (<channel>.json + .sig, read by
# src/updater.rs) and hub.txt (read by Hub, the owner's launcher: Hub's docs/COMPLIANCE.md), and
# uploads everything to a GitHub release.
#
# CHANGELOG.md drives the notes: the tag's version needs a "## <version>" entry (the first job
# fails the release without one); the entry is the release body and release-notes-<version>.md, its
# first line is the one-line note in hub.txt. Stable tags (v1.2.0) make a normal release, which
# is what Hub's releases/latest finds; tags with a suffix (v1.2.0-beta.1) make a pre-release, which
# Hub never sees. Never a draft: Hub cannot see drafts. Tags are v<version>.
#
# Secrets / variables (all optional; without them the build still works, unsigned):
#   secrets.BARBICAN_UPDATE_SIGNING_KEY   base64 Ed25519 seed for the update manifest
#                                         (make one: cargo run --example release_manifest -- keygen)
#   vars.BARBICAN_UPDATE_PUBKEY           matching public key, built into the app
#   vars.BARBICAN_UPDATE_FEED             manifest URL with {channel}, e.g.
#                                         https://updates.example.org/{channel}.json
#                                         (the release assets of a private repo are not public:
#                                         mirror <channel>.json(.sig) somewhere the app can reach)
#   vars.BARBICAN_UPDATE_ASSET_BASE       public base URL the packages are mirrored to, as
#                                         <base>/<tag>/<file> (required for updates while
#                                         the repo is private: release assets 404 without a token)
#                                         Manifests expire after 180 days: release, or re-run
#                                         the manifest tool, more often than that.
#   vars.BARBICAN_RELEASES_URL            page "Download" opens
#   vars.BUILD_MSI                        "true" builds the MSI too (on hold; a failing MSI never
#                                         fails the release)
#   secrets.WINDOWS_CERT_PFX_BASE64 / secrets.WINDOWS_CERT_PASSWORD
#                                         Authenticode: signs barbican.exe, the setup and the MSI
#   secrets.GPG_PRIVATE_KEY / secrets.GPG_PASSPHRASE
#                                         detached SHA256SUMS.asc
# The app only checks for updates when it was built with both the feed and the public key.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BARBICAN_UPDATE_PUBKEY: ${{ vars.BARBICAN_UPDATE_PUBKEY }}
  BARBICAN_UPDATE_FEED: ${{ vars.BARBICAN_UPDATE_FEED }}
  BARBICAN_RELEASES_URL: ${{ vars.BARBICAN_RELEASES_URL }}

jobs:
  changelog:
    # Fails in seconds, before any build, when the tag has no CHANGELOG.md entry.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Entry for the tag, and the release tools' tests
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $n = & ./tools/changelog-notes.ps1 -Version $v
          if ($LASTEXITCODE) { exit 1 }
          Write-Host "Hub note: $($n.OneLine)"
          & ./tools/test-release-tools.ps1
          if ($LASTEXITCODE) { exit 1 }

  windows:
    needs: changelog
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version from the tag
        shell: bash
        run: |
          # Cargo.lock follows on the next cargo command: no --locked here, or the bump would fail it
          v="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"/s//version = \"${v}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Test
        run: cargo test --release -j 4
      - name: Build
        run: cargo build --release -j 4
      - name: barbican.exe carries the release version (Hub reads it)
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $i = (Get-Item target\release\barbican.exe).VersionInfo
          Write-Host "ProductVersion $($i.ProductVersion), FileVersion $($i.FileVersion)"
          if ($i.ProductVersion -ne $v) { throw "barbican.exe has no version resource, or not $v (is rc.exe on the runner?)" }
      - name: Sign barbican.exe (hook)
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\barbican.exe
      - name: Inno Setup installer
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          ./tools/build-inno.ps1 -Version $v -Out dist
          if (-not $?) { exit 1 }
      - name: Sign the installer (hook)
        if: env.HAS_CERT == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\Barbican-Setup-*.exe).FullName
      - name: WiX 3 toolset (MSI, on hold)
        if: vars.BUILD_MSI == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe")) { choco install wixtoolset --version 3.14.1 -y --no-progress }
            $bin = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" | Select-Object -Last 1).DirectoryName
            "WIX=$(Split-Path $bin)\" >> $env:GITHUB_ENV
            $bin >> $env:GITHUB_PATH
          }
      - name: MSI (on hold)
        id: msi
        if: vars.BUILD_MSI == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          # MSI versions are numeric only: 1.2.0-beta.1 -> 1.2.301, 1.2.0 -> 1.2.999 (src/release_manifest.rs)
          $mv = cargo run --release -j 4 --example release_manifest -- msi-version $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo wix --no-build --nocapture --install-version $mv --output "dist\Barbican-$v-x86_64.msi"
      - name: Sign MSI (hook)
        if: env.HAS_CERT == 'true' && vars.BUILD_MSI == 'true' && steps.msi.outcome == 'success'
        continue-on-error: true
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\*.msi).FullName
      - name: Portable zip
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $d = "$env:RUNNER_TEMP\Barbican"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target\release\barbican.exe $d
          Set-Content -NoNewline -Encoding ascii "$d\install-kind" "zip"
          Compress-Archive -Path "$d\*" -DestinationPath "dist\barbican-$v-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libssl-dev pkg-config clang file libfuse2 hunspell
      - name: Version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"/s//version = \"${v}\"/" Cargo.toml
      - name: Test
        run: cargo test --release -j 4
      - name: Build
        run: cargo build --release -j 4
      - name: .deb
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb --no-build --output dist/
      - name: AppImage
        run: |
          v="${GITHUB_REF_NAME#v}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 LDAI_OUTPUT="dist/Barbican-${v}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable target/release/barbican \
            --desktop-file packaging/linux/barbican.desktop \
            --icon-file packaging/icons/barbican-256.png \
            --icon-filename barbican \
            --output appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [changelog, windows, linux]
    runs-on: ubuntu-22.04
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $n = & ./tools/changelog-notes.ps1 -Version $v -Out "dist/release-notes-$v.md"
          if ($LASTEXITCODE) { exit 1 }
          Get-Content "dist/release-notes-$v.md"
      - name: Checksums and signed update manifest
        env:
          BARBICAN_UPDATE_SIGNING_KEY: ${{ secrets.BARBICAN_UPDATE_SIGNING_KEY }}
          ASSET_BASE: ${{ vars.BARBICAN_UPDATE_ASSET_BASE }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libfontconfig1-dev pkg-config
          # The repo is private, so its release assets are not downloadable without a token:
          # set vars.BARBICAN_UPDATE_ASSET_BASE to the public mirror the packages are copied to
          # (one folder per tag). Without it the manifest points at the release, which only
          # works once the repo or a mirror is public.
          if [ -n "${ASSET_BASE}" ]; then base="${ASSET_BASE%/}/${GITHUB_REF_NAME}"
          else
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
            echo "::warning::BARBICAN_UPDATE_ASSET_BASE not set: update downloads will 404 while the repository is private"
          fi
          notes="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          cargo run --release --example release_manifest -- "${GITHUB_REF_NAME}" dist "$base" "$notes"
          cat dist/SHA256SUMS
      - name: hub.txt (for Hub), written from the uploaded files and checked
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $n = & ./tools/changelog-notes.ps1 -Version $v
          if ($LASTEXITCODE) { exit 1 }
          $files = @(
            @{ Name = "Barbican-Setup-$v.exe"; Path = "dist/Barbican-Setup-$v.exe"; Role = 'setup'
               Silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'; Scope = 'user' }
          )
          # in-process (&), not a child pwsh -File: the file list is hashtables
          & ./tools/write-hub-txt.ps1 -App barbican -Repo barbican -Version $v -Notes $n.OneLine `
            -NotesFile "release-notes-$v.md" -Kind setup -Exe barbican.exe `
            -Uninstall '{ACE04D99-4564-4E70-9A43-FE47A6A0E3B5}_is1' -Wait barbican.exe -Files $files -Out dist/hub.txt
          if ($LASTEXITCODE) { exit 1 }
          ./tools/verify-hub-txt.ps1 -HubTxt dist/hub.txt -Dir dist
          if ($LASTEXITCODE) { exit 1 }
          Get-Content dist/hub.txt
      - name: Sign checksums (hook)
        if: env.HAS_GPG == 'true'
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign dist/SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hub reads releases/latest, which skips drafts and pre-releases: a stable tag is a normal
          # release, a tag with a suffix (v1.2.0-beta.1) is a pre-release, and none is a draft.
          # --latest moves releases/latest, so a stable tag only gets it when it is the newest stable
          # version in the repository: an older maintenance tag (v1.2.1 after v1.3.0) would otherwise
          # move Hub back to it. When the tag list cannot be read (ls-remote failed, newest empty),
          # kind is still the --latest from above: the release is marked latest as before.
          kind="--latest"
          case "${GITHUB_REF_NAME}" in
            *-*) kind="--prerelease" ;;
            *)
              newest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1) || newest=""
              if [ -n "$newest" ] && [ "$newest" != "${GITHUB_REF_NAME}" ]; then
                echo "not the newest stable tag ($newest is): releases/latest stays there"
                kind="--latest=false"
              fi
              ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Barbican ${GITHUB_REF_NAME#v}" \
            --notes-file "dist/release-notes-${GITHUB_REF_NAME#v}.md" $kind
