# Release: push a tag v1.2.3 (stable) or v1.2.3-beta.1 (beta).
#
# Builds and tests on Windows x64 and Ubuntu, packages
#   Windows: per-user MSI (cargo-wix, wix/main.wxs) + portable zip
#   Linux:   AppImage (linuxdeploy) + .deb (cargo-deb)
# then writes SHA256SUMS and the signed update manifest (<channel>.json + .sig, read by
# src/updater.rs) and uploads everything to a GitHub release.
#
# Secrets / variables (all optional; without them the build still works, unsigned):
#   secrets.BARBICAN_UPDATE_SIGNING_KEY   base64 Ed25519 seed for the update manifest
#                                         (make one: cargo run --example release_manifest -- keygen)
#   vars.BARBICAN_UPDATE_PUBKEY           matching public key, built into the app
#   vars.BARBICAN_UPDATE_FEED             manifest URL with {channel}, e.g.
#                                         https://updates.example.org/{channel}.json
#                                         (the release assets of a private repo are not public:
#                                         mirror <channel>.json(.sig) somewhere the app can reach)
#   vars.BARBICAN_RELEASES_URL            page "Download" opens
#   secrets.WINDOWS_CERT_PFX_BASE64 / secrets.WINDOWS_CERT_PASSWORD
#                                         Authenticode: signs barbican.exe and the MSI
#   secrets.GPG_PRIVATE_KEY / secrets.GPG_PASSPHRASE
#                                         detached SHA256SUMS.asc
# The app only checks for updates when it was built with both the feed and the public key.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BARBICAN_UPDATE_PUBKEY: ${{ vars.BARBICAN_UPDATE_PUBKEY }}
  BARBICAN_UPDATE_FEED: ${{ vars.BARBICAN_UPDATE_FEED }}
  BARBICAN_RELEASES_URL: ${{ vars.BARBICAN_RELEASES_URL }}

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version from the tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"/s//version = \"${v}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Sign barbican.exe (hook)
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\barbican.exe
      - name: MSI
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          cargo wix --no-build --nocapture --output "dist\Barbican-$v-x86_64.msi"
      - name: Sign MSI (hook)
        if: env.HAS_CERT == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\*.msi).FullName
      - name: Portable zip
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $d = "$env:RUNNER_TEMP\Barbican"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target\release\barbican.exe $d
          Set-Content -NoNewline -Encoding ascii "$d\install-kind" "zip"
          Compress-Archive -Path "$d\*" -DestinationPath "dist\barbican-$v-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libssl-dev pkg-config clang file libfuse2 hunspell
      - name: Version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"/s//version = \"${v}\"/" Cargo.toml
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: .deb
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb --no-build --output dist/
      - name: AppImage
        run: |
          v="${GITHUB_REF_NAME#v}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 LDAI_OUTPUT="dist/Barbican-${v}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable target/release/barbican \
            --desktop-file packaging/linux/barbican.desktop \
            --icon-file packaging/icons/barbican-256.png \
            --icon-filename barbican \
            --output appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signed update manifest
        env:
          BARBICAN_UPDATE_SIGNING_KEY: ${{ secrets.BARBICAN_UPDATE_SIGNING_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libfontconfig1-dev pkg-config
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          notes="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          cargo run --release --example release_manifest -- "${GITHUB_REF_NAME}" dist "$base" "$notes"
          cat dist/SHA256SUMS
      - name: Sign checksums (hook)
        if: env.HAS_GPG == 'true'
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign dist/SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Barbican ${GITHUB_REF_NAME#v}" --generate-notes $pre
