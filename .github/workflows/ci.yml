# Build and test every push and pull request on Windows and Linux. No secrets, no artifacts.
# On Windows it also compiles the Inno Setup installer (never runs it), so the first compile is not
# at release time.
name: CI
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libssl-dev pkg-config clang hunspell
      - name: Build
        run: cargo build --release --locked -j 4
      - name: Test
        run: cargo test --release --locked -j 4
      - name: barbican.exe carries a version resource (Hub reads it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $want = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $i = (Get-Item target\release\barbican.exe).VersionInfo
          Write-Host "ProductVersion $($i.ProductVersion), FileVersion $($i.FileVersion)"
          if ($i.ProductVersion -ne $want) { throw "barbican.exe has no version resource, or not $want" }
      - name: Release tools (changelog notes, hub.txt writer and checker)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/test-release-tools.ps1
          if ($LASTEXITCODE) { exit 1 }
      - name: Inno Setup installer compiles (the real exe, a pre-release version, not run)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/build-inno.ps1 -Version 0.0.0-beta.1 -Out target\ci-inno
          if (-not $?) { exit 1 }
      - name: WiX 3 toolset (MSI, on hold, only with the repository variable BUILD_MSI = true)
        if: runner.os == 'Windows' && vars.BUILD_MSI == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe")) { choco install wixtoolset --version 3.14.1 -y --no-progress }
            $bin = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" | Select-Object -Last 1).DirectoryName
            "WIX=$(Split-Path $bin)\" >> $env:GITHUB_ENV
            $bin >> $env:GITHUB_PATH
          }
      - name: MSI compiles (candle + light, with a pre-release version)
        if: runner.os == 'Windows' && vars.BUILD_MSI == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          $mv = cargo run --release -j 4 --example release_manifest -- msi-version 0.0.0-beta.1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo wix --no-build --nocapture --install-version $mv --output target\ci-check.msi
