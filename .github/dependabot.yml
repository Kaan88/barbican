version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/plugins/spam-score"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
